<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chia Sẻ Mã HUD Free Fire Pro - 24/7</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 p-4 sticky top-0 bg-slate-900/90 backdrop-blur z-10">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold text-yellow-500 flex items-center gap-2">
        <span>🔥</span> HUD Sharing Hub
      </h1>
      
      <div class="flex items-center gap-3">
        <span class="hidden sm:inline-block text-xs bg-green-900/80 text-green-300 px-3 py-1 rounded-full font-bold border border-green-500/30">
          Server 24/7 Online
        </span>

        <!-- Khu vực Tài khoản -->
        <div id="user-area">
          <button onclick="openAuthModal('login')" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-extrabold text-xs px-4 py-2 rounded-xl transition shadow-md">
            Đăng nhập / Đăng ký
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Modal Popup Đăng nhập / Đăng ký -->
  <div id="auth-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
      
      <!-- Nút đóng x -->
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-full w-8 h-8 flex items-center justify-center text-sm transition">
        ✕
      </button>

      <!-- Tab chuyển Đăng nhập / Đăng ký -->
      <div class="flex border-b border-slate-800 mb-6">
        <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 text-sm font-bold border-b-2 border-yellow-500 text-yellow-400">
          Đăng nhập
        </button>
        <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-white">
          Tạo tài khoản
        </button>
      </div>

      <!-- Form Đăng nhập -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">Tên tài khoản</label>
          <input type="text" id="login-username" required placeholder="Nhập tên tài khoản" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-yellow-500 text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">Mật khẩu</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-yellow-500 text-white">
        </div>
        <p id="login-error" class="text-xs text-red-400 hidden"></p>
        <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-lg text-sm">
          Đăng nhập ngay
        </button>
      </form>

      <!-- Form Đăng ký -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">Tạo tên tài khoản</label>
          <input type="text" id="reg-username" required placeholder="Ví dụ: gamer123" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-yellow-500 text-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">Tạo mật khẩu</label>
          <input type="password" id="reg-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-yellow-500 text-white">
        </div>
        <p id="reg-error" class="text-xs text-red-400 hidden"></p>
        <button type="submit" class="w-full bg-green-500 hover:bg-green-400 text-white font-extrabold py-3 rounded-xl transition shadow-lg text-sm">
          Tạo tài khoản mới
        </button>
      </form>

    </div>
  </div>

  <!-- Content Container -->
  <main class="max-w-6xl mx-auto p-4 mt-6">
    
    <!-- Bộ Lọc Tab -->
    <div class="flex flex-wrap gap-3 mb-8 justify-center sm:justify-start">
      <button onclick="filterHUDs('all')" id="btn-all" class="tab-btn bg-yellow-500 text-slate-950 font-extrabold px-5 py-2.5 rounded-xl text-sm transition-all shadow-md">
        🌟 Tất Cả HUD
      </button>
      <button onclick="filterHUDs(2)" id="btn-2" class="tab-btn bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold px-5 py-2.5 rounded-xl text-sm border border-slate-700 transition-all">
        ⚡ Gói 2 Ngón
      </button>
      <button onclick="filterHUDs(3)" id="btn-3" class="tab-btn bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold px-5 py-2.5 rounded-xl text-sm border border-slate-700 transition-all">
        ⚡ Gói 3 Ngón
      </button>
      <button onclick="filterHUDs(4)" id="btn-4" class="tab-btn bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold px-5 py-2.5 rounded-xl text-sm border border-slate-700 transition-all">
        ⚡ Gói 4 Ngón
      </button>
    </div>

    <!-- Grid danh sách HUD -->
    <div id="hud-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>

  <script>
    let currentUser = null;

    // Quản lý Modal & Tab
    function openAuthModal(type = 'login') {
      document.getElementById('auth-modal').classList.remove('hidden');
      switchTab(type);
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    function switchTab(type) {
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formReg = document.getElementById('form-register');

      if (type === 'login') {
        tabLogin.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-yellow-500 text-yellow-400";
        tabReg.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-white";
        formLogin.classList.remove('hidden');
        formReg.classList.add('hidden');
      } else {
        tabReg.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-yellow-500 text-yellow-400";
        tabLogin.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-white";
        formReg.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    }

    // Xử lý Đăng ký
    function handleRegister(e) {
      e.preventDefault();
      const u = document.getElementById('reg-username').value.trim();
      const p = document.getElementById('reg-password').value.trim();
      const err = document.getElementById('reg-error');

      let users = JSON.parse(localStorage.getItem('app_users') || '{}');
      if (users[u]) {
        err.innerText = "Tên tài khoản này đã tồn tại!";
        err.classList.remove('hidden');
        return;
      }

      users[u] = p;
      localStorage.setItem('app_users', JSON.stringify(users));
      
      currentUser = u;
      localStorage.setItem('current_user', u);
      closeAuthModal();
      renderUserHeader();
      renderHUDs();
    }

    // Xử lý Đăng nhập
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      const err = document.getElementById('login-error');

      let users = JSON.parse(localStorage.getItem('app_users') || '{}');
      if (!users[u] || users[u] !== p) {
        err.innerText = "Sai tên tài khoản hoặc mật khẩu!";
        err.classList.remove('hidden');
        return;
      }

      currentUser = u;
      localStorage.setItem('current_user', u);
      closeAuthModal();
      renderUserHeader();
      renderHUDs();
    }

    function checkLogin() {
      const saved = localStorage.getItem('current_user');
      if (saved) {
        currentUser = saved;
        renderUserHeader();
      }
    }

    function renderUserHeader() {
      const userArea = document.getElementById('user-area');
      userArea.innerHTML = `
        <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
          <span class="text-xs font-bold text-yellow-400">👤 ${currentUser}</span>
          <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 ml-2 font-bold">Đăng xuất</button>
        </div>
      `;
    }

    function logout() {
      localStorage.removeItem('current_user');
      currentUser = null;
      location.reload();
    }

    let currentFilter = 'all';

    function renderHUDs() {
      const container = document.getElementById('hud-list');
      container.innerHTML = '';

      const filteredData = currentFilter === 'all' 
        ? hudsData 
        : hudsData.filter(item => item.fingers === currentFilter);

      filteredData.forEach(hud => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800/90 rounded-2xl overflow-hidden border border-slate-700/80 hover:border-yellow-500 transition-all duration-300 shadow-xl flex flex-col justify-between';

            <button onclick="copyCode('${hud.hud_code}', this)" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-extrabold text-xs px-4 py-2 rounded-lg transition-all duration-200 active:scale-95 shrink-0 shadow-md">
              Sao chép
            </button>
          </div>

            <div class="text-xs text-gray-400 flex items-start gap-1.5 bg-slate-900/60 p-2.5 rounded-lg border border-slate-800/80 ${!currentUser ? 'blur-[1.5px] select-none' : ''}">
              <span class="text-yellow-500 shrink-0">💡</span>
              <span><strong class="text-gray-300">Chỉnh nhanh:</strong> ${hud.tip}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterHUDs(fingers) {
      currentFilter = fingers;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold px-5 py-2.5 rounded-xl text-sm border border-slate-700 transition-all';
      });
      const activeBtn = document.getElementById(fingers === 'all' ? 'btn-all' : `btn-${fingers}`);
      if (activeBtn) {
        activeBtn.className = 'tab-btn bg-yellow-500 text-slate-950 font-extrabold px-5 py-2.5 rounded-xl text-sm transition-all shadow-md';
      }
      renderHUDs();
    }

    function copyCode(code, btn) {
      navigator.clipboard.writeText(code).then(() => {
        const originalText = btn.innerText;
        btn.innerText = 'Đã chép! ✓';
        btn.className = btn.className.replace('bg-yellow-500 hover:bg-yellow-400 text-slate-950', 'bg-green-500 text-white');
        
        setTimeout(() => {
          btn.innerText = originalText;
          btn.className = btn.className.replace('bg-green-500 text-white', 'bg-yellow-500 hover:bg-yellow-400 text-slate-950');
        }, 2000);
      });
    }

    checkLogin();
    renderHUDs();
  </script>
</body>
</html>
